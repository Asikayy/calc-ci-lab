# Workflow GitHub Actions для ЛПР 12.
# Файл обязан лежать в каталоге .github/workflows/ репозитория.
name: CI
# Событие-триггер: любой push в любую ветку, pull request в main и ручной
запуск.
on:
push:
pull_request:
branches: [main]
workflow_dispatch:
jobs:
# ---------- Этап 1. Статическая проверка кода ----------
lint:
name: Проверка кода (flake8)
runs-on: ubuntu-latest
steps:
- name: Получить исходный код
uses: actions/checkout@v7
- name: Установить Python
uses: actions/setup-python@v7
with:
python-version: "3.12"
cache: pip
cache-dependency-path: requirements-dev.txt
- name: Установить зависимости
run: pip install -r requirements-dev.txt
- name: Запустить flake8
run: flake8 src tests
# ---------- Этап 2. Автоматические тесты ----------
test:
name: Тесты (pytest)
runs-on: ubuntu-latest
needs: lint # запускается только после успешного lint
steps:
- uses: actions/checkout@v7

- uses: actions/setup-python@v7
with:
python-version: "3.12"
cache: pip
cache-dependency-path: requirements-dev.txt
- run: pip install -r requirements-dev.txt
- name: Запустить pytest
run: pytest -v --junitxml=report.xml
- name: Сохранить отчёт о тестах
uses: actions/upload-artifact@v7
if: always() # отчёт нужен и при провале тестов
with:
name: test-report
path: report.xml
# ---------- Этап 3. Сборка пакета ----------
build:
name: Сборка пакета
runs-on: ubuntu-latest
needs: test
steps:
- uses: actions/checkout@v7
- uses: actions/setup-python@v7
with:
python-version: "3.12"
- name: Собрать wheel и sdist
run: |
pip install build
python -m build
- name: Проверить, что собранный пакет устанавливается и работает
run: |
pip install dist/*.whl
calc add 2 3
- name: Сохранить артефакт сборки
uses: actions/upload-artifact@v7
with:
name: dist
path: dist/
Б.2. GitLab CI/CD: .gitlab-ci.yml
# Pipeline GitLab CI/CD для ЛПР 12.
# Файл обязан лежать в корне репозитория и называться .gitlab-ci.yml.

# Порядок этапов (stages): следующий этап начинается
# только после успеха предыдущего.
stages:
- lint
- test
- build
# Настройки по умолчанию для всех заданий.
default:
image: python:3.12-slim
before_script:
- python --version
- pip install --quiet -r requirements-dev.txt
# Когда создавать pipeline: при push, из веб-интерфейса и для merge request.
workflow:
rules:
- if: $CI_PIPELINE_SOURCE == "push"
- if: $CI_PIPELINE_SOURCE == "web"
- if: $CI_PIPELINE_SOURCE == "merge_request_event"
# ---------- Этап 1. Статическая проверка кода ----------
lint:
stage: lint
script:
- flake8 src tests
# ---------- Этап 2. Автоматические тесты ----------
test:
stage: test
script:
- pytest -v --junitxml=report.xml
artifacts:
when: always # отчёт нужен и при провале тестов
reports:
junit: report.xml # GitLab покажет результаты на вкладке Tests
expire_in: 1 week
# ---------- Этап 3. Сборка пакета ----------
build:
stage: build
script:
- python -m build
- pip install dist/*.whl
- calc add 2 3
artifacts:
paths:
- dist/
expire_in: 1 week